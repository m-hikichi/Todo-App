services:
  todo-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: todo_app:dev
    container_name: todo_app
    ports:
      - "8080:8080"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      APP_DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data
  todo-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runner
    image: todo_app:test
    profiles: ["test"]
    working_dir: /src
    command: ["go", "test", "./..."]
    volumes:
      - ./:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  go-mod-cache:
  go-build-cache:
